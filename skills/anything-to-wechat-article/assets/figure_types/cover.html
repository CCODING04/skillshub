<!doctype html>
<!-- 范式示例 | 1080x460 头图：主标题 + 元数据 + 抽象视觉；替换标题与署名即可 | 固定画布、全内联样式、无外链、中文用系统字体栈 --><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:1080px;height:460px;overflow:hidden}
body{background:#FBFAF7;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#20344F;position:relative}

.rule{position:absolute;left:70px;top:268px;width:64px;height:5px;background:#20344F;border-radius:3px}
.meta{position:absolute;left:70px;top:298px;font-size:19px;color:#5A6675;line-height:1.9}
.meta span{color:#8A94A0}
.stack{position:absolute;right:74px;top:66px;width:330px;height:330px}
.card{position:absolute;width:268px;height:150px;border-radius:16px;background:#fff;border:1px solid #E8E4DD;box-shadow:0 10px 26px rgba(32,52,79,.07);padding:22px}

.line{height:9px;border-radius:5px;background:#EDEAE4;margin-bottom:13px}
.line.s{width:62%}.line.m{width:84%}
.chk{display:inline-block;width:17px;height:17px;border-radius:5px;background:#E27145;color:#fff;font-size:12px;text-align:center;line-height:17px;margin-right:9px}
.q{position:absolute;right:2px;top:150px;width:96px;height:96px;border-radius:50%;background:#20344F;color:#fff;font-size:58px;font-weight:800;text-align:center;line-height:96px;box-shadow:0 12px 28px rgba(32,52,79,.22)}
.foot{position:absolute;left:70px;bottom:36px;font-size:15px;color:#A6AEB7;letter-spacing:1px}
</style></head><body>

  <div class="q">?</div>
</div>
<div class="foot">从一段手持拍摄的现场视频，整理出这份逐字稿与思考脉络</div>
</body></html>
